name: Deploy to Firebase Hosting

# Build the Next.js static export and deploy `out/` to Firebase Hosting.
# See FIREBASE.md for the project architecture (Spark/free plan, static export).
#
# Required GitHub secret:
#   FIREBASE_SERVICE_ACCOUNT — service account JSON key for the `pdskwork`
#   Firebase project (Console → Project settings → Service accounts →
#   "Generate new private key"). Stored as a repository Actions secret.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Prevent overlapping deploys from clobbering each other.
concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

# Least-privilege permissions. The hosting-deploy action authenticates from
# the service account key directly, so no id-token: write is needed.
permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build (static export → out/)
        env:
          NEXT_PUBLIC_SITE_URL: https://pdskwork.web.app
          NEXT_PUBLIC_APP_NAME: PdskWork
        run: npm run build

      - name: Verify build output
        run: |
          test -d out
          test -f out/index.html
          echo "Static export present in out/"

      # Seed Firestore so the blog posts appear on the live site.
      # The service-account JSON is written to a temp file so firebase-admin can
      # authenticate via GOOGLE_APPLICATION_CREDENTIALS — the same secret is used
      # for both hosting deploy and the Admin SDK seed.
      - name: Seed Firestore with blog posts
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-svc-account.json
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e
          mkdir -p /tmp
          
          # Decode base64 secret if needed, otherwise use raw JSON
          if echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$GOOGLE_APPLICATION_CREDENTIALS" 2>/dev/null; then
            echo "✓ Service account decoded from base64"
          else
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
            echo "✓ Service account written as raw JSON"
          fi
          
          # Verify the JSON is valid
          if ! node -e "JSON.parse(require('fs').readFileSync('$GOOGLE_APPLICATION_CREDENTIALS'))"; then
            echo "ERROR: Invalid service account JSON"
            exit 1
          fi
          echo "✓ Service account JSON is valid"
          
          # Count posts to be seeded
          POST_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/db/blog.json')).length)")
          echo "Posts to seed: $POST_COUNT"
          
          # Run seed script
          echo "Seeding Firestore..."
          npm run seed:firestore
          
          # Clean up credentials
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          echo "✓ Firestore seeding complete"

      - name: Deploy Firestore rules and indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-svc-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-svc-account.json
          firebase deploy --only firestore:rules,firestore:indexes --project pdskwork
          rm -f /tmp/firebase-svc-account.json
        # Service account must have Service Usage Admin / Editor role to
        # auto-enable the Firestore API. If it lacks that permission this
        # step fails — allow the hosting deploy to proceed regardless.
        continue-on-error: true

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          # The action does its own auth from the service account JSON — no
          # separate google-github-actions/auth step needed.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: pdskwork
          channelId: live
          # `out/` is the static export dir (next.config.ts → distDir: 'out').
          # The action reads `firebase.json` → hosting.public from the repo root.
          entryPoint: ${{ github.workspace }}

      - name: Deployment info
        run: |
          echo "Live site: https://pdskwork.web.app"
          echo "Firebase console: https://console.firebase.google.com/project/pdskwork/hosting"
